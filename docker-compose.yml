services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nearwatch
      POSTGRES_PASSWORD: nearwatch
      POSTGRES_DB: nearwatch
    ports:
      - "5433:5432"   # 5433 снаружи, чтобы не конфликтовать с локальным Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearwatch -d nearwatch"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ingestion добавится сюда, когда появится Dockerfile и main.go

volumes:
  pgdata:
